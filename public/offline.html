<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1419" />
    <title>لا يوجد اتصال · ڤيب شوب</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --canvas: #f7f8fa;
        --card: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #059669;
        --warning-soft: #fffbeb;
        --warning: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b0e13;
          --card: #11161d;
          --ink: #f3f4f6;
          --muted: #9ca3af;
          --line: #232a33;
          --accent: #34d399;
          --warning-soft: #2a1f08;
          --warning: #f59e0b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--warning-soft);
        color: var(--warning);
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p {
        margin: 10px 0 0;
        font-size: 14px;
        line-height: 1.8;
        color: var(--muted);
      }
      .note {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--canvas);
        border: 1px solid var(--line);
        font-size: 13px;
        text-align: right;
      }
      button {
        margin-top: 20px;
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2.01-1.64" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر فتح الصفحة لأن الجهاز غير متصل. تحقق من الشبكة ثم أعد المحاولة.</p>
      <div class="note">
        لا تُسجَّل المبيعات والمدفوعات دون اتصال، حتى لا تتكرر العملية أو يُباع صنف غير متوفر. أي
        عملية أرسلتها قبل الانقطاع محمية من التكرار عند إعادة إرسالها.
      </div>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
